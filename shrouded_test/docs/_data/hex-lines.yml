# Hex line definitions independent of _wiki pages.
# Path uses direction tokens separated by '->'.
# Allowed direction tokens:
#   Top, TopRight, Right, BottomRight, Bottom, BottomLeft, Left, TopLeft, Center
# Edge strokes can be defined with an edge: "00.03 00.04" entry, which will
# stroke the shared border for both hexes.
# Optional aliases:
#   NE = TopRight, NW = TopLeft, SE = BottomRight, SW = BottomLeft

direction_tokens:
  - Top
  - TopRight
  - Right
  - BottomRight
  - Bottom
  - BottomLeft
  - Left
  - TopLeft
  - Center

direction_aliases:
  NE: TopRight
  NW: TopLeft
  SE: BottomRight
  SW: BottomLeft

