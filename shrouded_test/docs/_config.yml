title: "Shrouded Lands Wiki Mirror"
markdown: kramdown
baseurl: ""
url: ""

destination: "C:/jekyll-output/shrouded_test"

collections:
  wiki:
    output: true
    permalink: /wiki/:name/
    render_with_liquid: false

defaults:
  - scope:
      path: ""
      type: wiki
    values:
      layout: wiki_page

exclude:
  - _ignore_wiki_templates

plugins:
  - jekyll-seo-tag
