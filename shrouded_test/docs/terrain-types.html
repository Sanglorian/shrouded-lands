<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Terrain types</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        margin: 2rem;
        color: #222;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        max-width: 720px;
      }
      th, td {
        border: 1px solid #ccc;
        padding: 0.5rem 0.75rem;
        text-align: left;
        vertical-align: middle;
      }
      th {
        background: #f4f4f4;
      }
      td.example {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <h1>Terrain types</h1>
    <table>
      <thead>
        <tr>
          <th>Terrain</th>
          <th>Example</th>
        </tr>
      </thead>
      <tbody>
<tr>
  <td>mountain-range</td>
  <td class="example"><svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="⛰︎"><polygon points="54.0,30.0 42.0,9.2 18.0,9.2 6.0,30.0 18.0,50.8 42.0,50.8" fill="#b28000" stroke="#222" stroke-width="2"/><text x="30.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="sans-serif" fill="#424826">⛰︎</text></svg></td>
</tr>
<tr>
  <td>snowy-mountains</td>
  <td class="example"><svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="🏔︎"><polygon points="54.0,30.0 42.0,9.2 18.0,9.2 6.0,30.0 18.0,50.8 42.0,50.8" fill="#b28000" stroke="#222" stroke-width="2"/><text x="30.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="sans-serif" fill="#424826">🏔︎</text></svg></td>
</tr>
<tr>
  <td>lone-mountain</td>
  <td class="example"><svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="🗻︎"><polygon points="54.0,30.0 42.0,9.2 18.0,9.2 6.0,30.0 18.0,50.8 42.0,50.8" fill="#c68f00" stroke="#222" stroke-width="2"/><text x="30.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="sans-serif" fill="#424826">🗻︎</text></svg></td>
</tr>
<tr>
  <td>foothills</td>
  <td class="example"><svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="🏞︎"><polygon points="54.0,30.0 42.0,9.2 18.0,9.2 6.0,30.0 18.0,50.8 42.0,50.8" fill="#cd9b00" stroke="#222" stroke-width="2"/><text x="30.0" y="30.0" text-anchor="middle" dominant-baseline="middle" font-size="24" font-family="sans-serif" fill="#545556">🏞︎</text></svg></td>
</tr>
      </tbody>
    </table>
  </body>
</html>
